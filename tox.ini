[tox]
envlist =
  py{310,311,312,313,314,315}
  cov

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314
  3.15: py315

[pytest]
testpaths = testit
python_files = testaa_*.py
pythonpath = .

[testenv]
deps = pytest
commands = py.test {posargs:testit}

[testenv:cov]
basepython = 3.15
deps = pytest-cov
commands = py.test --cov=setuptools_tiedostot --cov-report=xml {posargs:testit}
